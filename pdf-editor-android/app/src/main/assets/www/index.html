<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#B3261E">
<title>PDF Editor</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ Top bar ============ -->
<header id="topbar">
  <button class="icon-btn" id="btnMenu" title="Menu" data-icon="menu"></button>
  <div id="docTitle">PDF Editor</div>
  <button class="icon-btn" id="btnUndo" title="Undo" data-icon="undo" disabled></button>
  <button class="icon-btn" id="btnRedo" title="Redo" data-icon="redo" disabled></button>
  <button class="icon-btn" id="btnPages" title="Pages" data-icon="pages"></button>
  <button class="icon-btn accent" id="btnSave" title="Save" data-icon="save"></button>
</header>

<!-- ============ Home screen ============ -->
<section id="home">
  <div class="home-head">
    <div class="home-logo" data-icon="logo"></div>
    <div>
      <h1>PDF Editor</h1>
      <p class="muted">Free, offline, no watermarks, no limits.</p>
    </div>
  </div>
  <button class="big-btn primary" id="homeOpen"><span data-icon="open"></span>Open PDF</button>
  <div class="tool-grid">
    <button data-home="edit"><span class="tg-ic" data-icon="edittext"></span>Edit</button>
    <button data-home="convert"><span class="tg-ic" data-icon="convert"></span>Convert</button>
    <button data-home="compress"><span class="tg-ic" data-icon="compress"></span>Compress</button>
    <button data-home="merge"><span class="tg-ic" data-icon="merge"></span>Merge</button>
    <button data-home="annotate"><span class="tg-ic" data-icon="highlight"></span>Annotate</button>
    <button data-home="organize"><span class="tg-ic" data-icon="pages"></span>Organize</button>
    <button data-home="protect"><span class="tg-ic" data-icon="lock"></span>Protect</button>
    <button data-home="read"><span class="tg-ic" data-icon="read"></span>Read</button>
    <button data-home="print"><span class="tg-ic" data-icon="print"></span>Print</button>
    <button data-home="ocr"><span class="tg-ic" data-icon="ocr"></span>OCR</button>
    <button data-home="sign"><span class="tg-ic" data-icon="sign"></span>Sign</button>
    <button data-home="images"><span class="tg-ic" data-icon="image"></span>Images to PDF</button>
    <button data-home="blank"><span class="tg-ic" data-icon="blank"></span>Blank PDF</button>
  </div>
  <p class="muted small">Tip: use “Open with → PDF Editor” from any file manager.</p>
</section>

<!-- ============ Document view ============ -->
<main id="viewer" hidden>
  <div id="pages"></div>
</main>

<!-- ============ Properties bar ============ -->
<div id="propbar" hidden>
  <div id="propColors" class="prop-group"></div>
  <div class="prop-group" id="propSizeWrap">
    <span class="prop-label" id="propSizeLabel">Size</span>
    <input type="range" id="propSize" min="1" max="72" step="1">
    <span class="prop-val" id="propSizeVal"></span>
  </div>
  <div class="prop-group" id="propFontWrap">
    <select id="propFont"></select>
    <button class="chip" id="propBold"><b>B</b></button>
    <button class="chip" id="propItalic"><i>I</i></button>
    <button class="chip" id="propBg" title="White background">BG</button>
  </div>
  <div class="prop-group" id="propImgWrap">
    <button class="chip" id="propReplaceImg"><span data-icon="swap"></span>Replace</button>
    <button class="chip" id="propCropImg"><span data-icon="crop"></span>Crop</button>
  </div>
  <div class="prop-group" id="propFillWrap">
    <button class="chip" id="propFill">Fill</button>
  </div>
  <div class="prop-group" id="propDoneWrap">
    <button class="chip primary" id="propDone"><span data-icon="check"></span>Done</button>
  </div>
  <div class="prop-group" id="propSelWrap">
    <button class="chip" id="propDup" title="Duplicate"><span data-icon="copy"></span></button>
    <button class="chip danger" id="propDelete" title="Delete"><span data-icon="delete"></span></button>
  </div>
</div>

<!-- ============ Bottom toolbar ============ -->
<nav id="toolbar" hidden>
  <button class="tool active" data-tool="select"><span data-icon="select"></span>Select</button>
  <button class="tool" data-tool="text"><span data-icon="text"></span>Add Text</button>
  <button class="tool" data-tool="edittext"><span data-icon="edittext"></span>Edit Text</button>
  <button class="tool" data-tool="editimage"><span data-icon="imageedit"></span>Edit Images</button>
  <button class="tool" data-action="find"><span data-icon="find"></span>Find &amp; Fix</button>
  <button class="tool" data-action="ocr"><span data-icon="ocr"></span>OCR</button>
  <button class="tool" data-tool="draw"><span data-icon="draw"></span>Draw</button>
  <button class="tool" data-tool="highlight"><span data-icon="highlight"></span>Highlight</button>
  <button class="tool" data-tool="whiteout"><span data-icon="eraser"></span>Whiteout</button>
  <button class="tool" data-tool="rect"><span data-icon="rect"></span>Box</button>
  <button class="tool" data-tool="ellipse"><span data-icon="ellipse"></span>Circle</button>
  <button class="tool" data-tool="line"><span data-icon="line"></span>Line</button>
  <button class="tool" data-tool="arrow"><span data-icon="arrow"></span>Arrow</button>
  <button class="tool" data-tool="check"><span data-icon="check"></span>Tick</button>
  <button class="tool" data-tool="cross"><span data-icon="cross"></span>Cross</button>
  <button class="tool" data-tool="date"><span data-icon="date"></span>Date</button>
  <button class="tool" data-action="image"><span data-icon="image"></span>Image</button>
  <button class="tool" data-action="sign"><span data-icon="sign"></span>Sign</button>
  <button class="tool" data-action="forms"><span data-icon="form"></span>Forms</button>
  <button class="tool" data-action="read"><span data-icon="read"></span>Read</button>
  <button class="tool" data-action="zoomout"><span data-icon="zoomout"></span>Zoom −</button>
  <button class="tool" data-action="zoomin"><span data-icon="zoomin"></span>Zoom +</button>
</nav>

<!-- ============ Menu ============ -->
<div id="menuBackdrop" class="backdrop" hidden></div>
<aside id="menu" hidden>
  <div class="menu-head">PDF Editor</div>
  <button data-menu="open"><span data-icon="open"></span>Open PDF…</button>
  <button data-menu="merge"><span data-icon="merge"></span>Merge: append PDF…</button>
  <button data-menu="images"><span data-icon="image"></span>Add images as pages…</button>
  <button data-menu="blankpage"><span data-icon="blank"></span>Add blank page</button>
  <button data-menu="pages"><span data-icon="pages"></span>Organize pages</button>
  <button data-menu="forms"><span data-icon="form"></span>Fill form fields</button>
  <hr>
  <button data-menu="find"><span data-icon="find"></span>Find &amp; replace (fix typos)…</button>
  <button data-menu="ocr"><span data-icon="ocr"></span>OCR: recognise text in scans…</button>
  <button data-menu="convert"><span data-icon="convert"></span>Convert (JPG, PNG, Word, Text)…</button>
  <button data-menu="compress"><span data-icon="compress"></span>Compress…</button>
  <button data-menu="protect"><span data-icon="lock"></span>Protect / Unlock…</button>
  <button data-menu="read"><span data-icon="read"></span>Reading mode</button>
  <button data-menu="print"><span data-icon="print"></span>Print…</button>
  <hr>
  <button data-menu="save"><span data-icon="save"></span>Save as…</button>
  <button data-menu="share"><span data-icon="share"></span>Share</button>
  <button data-menu="rename"><span data-icon="edittext"></span>Rename file</button>
  <hr>
  <button data-menu="close"><span data-icon="close"></span>Close document</button>
</aside>

<!-- ============ Pages panel ============ -->
<section id="pagesPanel" class="sheet" hidden>
  <header class="sheet-head">
    <button class="icon-btn" data-close="pagesPanel" data-icon="back"></button>
    <div class="sheet-title">Pages <span id="pagesCount" class="muted"></span></div>
    <button class="chip" id="pgSelectAll">Select all</button>
  </header>
  <div id="thumbs"></div>
  <footer class="sheet-actions">
    <button data-pg="rotl"><span data-icon="rotl"></span>Rotate</button>
    <button data-pg="rotr"><span data-icon="rotr"></span>Rotate</button>
    <button data-pg="left"><span data-icon="left"></span>Move</button>
    <button data-pg="right"><span data-icon="right"></span>Move</button>
    <button data-pg="dup"><span data-icon="copy"></span>Duplicate</button>
    <button data-pg="blank"><span data-icon="blank"></span>Blank</button>
    <button data-pg="extract"><span data-icon="extract"></span>Extract</button>
    <button data-pg="delete" class="danger"><span data-icon="delete"></span>Delete</button>
  </footer>
</section>

<!-- ============ Forms panel ============ -->
<section id="formsPanel" class="sheet" hidden>
  <header class="sheet-head">
    <button class="icon-btn" data-close="formsPanel" data-icon="back"></button>
    <div class="sheet-title">Form fields</div>
    <button class="chip primary" id="formsApply">Apply</button>
  </header>
  <div id="formsList"></div>
  <footer class="sheet-foot">
    <label class="check"><input type="checkbox" id="formsFlatten"> Flatten (make fields non-editable)</label>
  </footer>
</section>

<!-- ============ Signature modal ============ -->
<div id="signModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-title">Signature</div>
    <div id="savedSigs"></div>
    <canvas id="sigPad"></canvas>
    <div class="sig-colors">
      <button class="swatch" data-sigcolor="#000000" style="background:#000"></button>
      <button class="swatch" data-sigcolor="#1a3fb8" style="background:#1a3fb8"></button>
      <button class="swatch" data-sigcolor="#b3261e" style="background:#b3261e"></button>
      <span class="spacer"></span>
      <button class="chip" id="sigClear">Clear</button>
    </div>
    <div class="modal-actions">
      <button class="chip" id="sigCancel">Cancel</button>
      <button class="chip primary" id="sigUse">Use signature</button>
    </div>
  </div>
</div>

<!-- ============ Generic dialog ============ -->
<div id="dialog" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-title" id="dlgTitle"></div>
    <div id="dlgBody"></div>
    <input id="dlgInput" type="text" hidden>
    <div class="modal-actions">
      <button class="chip" id="dlgCancel">Cancel</button>
      <button class="chip primary" id="dlgOk">OK</button>
    </div>
  </div>
</div>

<!-- ============ Option sheet (convert / compress / protect) ============ -->
<div id="optModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-title" id="optTitle"></div>
    <div id="optBody"></div>
    <div class="modal-actions">
      <button class="chip" id="optCancel">Close</button>
    </div>
  </div>
</div>

<!-- ============ Crop image ============ -->
<div id="cropModal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-title">Crop image</div>
    <div id="cropStage"><img id="cropImg" alt=""><div id="cropRect"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div>
    <div class="modal-actions">
      <button class="chip" id="cropReset">Reset</button>
      <span class="spacer"></span>
      <button class="chip" id="cropCancel">Cancel</button>
      <button class="chip primary" id="cropApply">Crop</button>
    </div>
  </div>
</div>

<!-- ============ Reading mode bar ============ -->
<div id="readBar" hidden>
  <button class="icon-btn" id="readExit" data-icon="back" title="Exit reading"></button>
  <div id="readPage"></div>
  <button class="icon-btn" id="readGoto" data-icon="pages" title="Go to page"></button>
  <button class="icon-btn" id="readNight" data-icon="night" title="Night mode"></button>
</div>

<div id="busy" hidden><div class="spinner"></div><div id="busyText">Working…</div></div>
<div id="toast" hidden></div>

<input type="file" id="filePdf" accept="application/pdf" hidden>
<input type="file" id="fileMerge" accept="application/pdf" multiple hidden>
<input type="file" id="fileImage" accept="image/*" hidden>
<input type="file" id="fileImagesPages" accept="image/*" multiple hidden>

<script src="lib/pdf.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/fontkit.min.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<script src="tools.js"></script>
<script src="edit2.js"></script>
</body>
</html>
