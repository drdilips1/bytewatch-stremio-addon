plugins {
    id 'com.android.application'
}

android {
    namespace 'org.research4life.portal'
    compileSdk 34

    defaultConfig {
        applicationId 'app.dermscholar'
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName '2.12'
    }

    // A fixed key so new builds install over old ones without wiping the saved library.
    signingConfigs {
        dermscholar {
            storeFile file('dermscholar.keystore')
            storePassword 'dermscholar'
            keyAlias 'dermscholar'
            keyPassword 'dermscholar'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.dermscholar
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.dermscholar
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        // The Claude SDK uses java.time; desugaring makes that work back to Android 7.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.anthropic:anthropic-java:2.65.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
    implementation 'androidx.core:core:1.13.1'
}
