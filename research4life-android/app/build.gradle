plugins {
    id 'com.android.application'
}

android {
    namespace 'org.research4life.portal'
    compileSdk 34

    defaultConfig {
        applicationId 'app.dermscholar'
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName '4.1'
        // Neural voices ship native code for phones (64- and 32-bit ARM).
        // 64-bit ARM only: every current phone (Samsung Galaxy included); keeps the APK small enough to share.
        ndk { abiFilters 'arm64-v8a' }
    }

    // A fixed key so new builds install over old ones without wiping the saved library.
    signingConfigs {
        dermscholar {
            storeFile file('dermscholar.keystore')
            storePassword 'dermscholar'
            keyAlias 'dermscholar'
            keyPassword 'dermscholar'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.dermscholar
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.dermscholar
        }
    }

    packaging {
        // Compress native libraries in the APK (keeps the download smaller).
        jniLibs { useLegacyPackaging true }
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        // The Claude SDK uses java.time; desugaring makes that work back to Android 7.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.anthropic:anthropic-java:2.65.0'
    // On-device text recognition for photos and scanned PDFs (Latin scripts, model bundled).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // On-device neural text-to-speech (Kokoro, Piper). The AAR is fetched by tools/fetch-sherpa.sh.
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    // Unpacks downloaded voice packs (.tar.bz2).
    implementation 'org.apache.commons:commons-compress:1.27.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
    implementation 'androidx.core:core:1.13.1'
}
