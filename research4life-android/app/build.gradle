plugins {
    id 'com.android.application'
}

android {
    namespace 'org.research4life.portal'
    compileSdk 34

    defaultConfig {
        applicationId 'app.dermscholar'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '2.2'
    }

    // A fixed key so new builds install over old ones without wiping the saved library.
    signingConfigs {
        dermscholar {
            storeFile file('dermscholar.keystore')
            storePassword 'dermscholar'
            keyAlias 'dermscholar'
            keyPassword 'dermscholar'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.dermscholar
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.dermscholar
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
