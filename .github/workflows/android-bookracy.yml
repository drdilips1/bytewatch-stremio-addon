name: Build Bookracy Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-bookracy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle -p android assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Bookracy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bookracy-apk
          path: Bookracy.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bookracy-app-${{ github.run_number }}
          name: Bookracy Android app (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Download **Bookracy.apk** below on your phone, open it, and allow installing from your browser/files app when prompted.
          files: Bookracy.apk
          make_latest: true
