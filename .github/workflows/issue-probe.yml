name: Issue probe
on:
  push:
    paths: ['.github/workflows/issue-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://www.ebi.ac.uk/europepmc/webservices/rest/search"
          echo "=== lite fields"; curl -sG "$B" --data-urlencode 'query=ISSN:"0190-9622" AND PUB_YEAR:2026' -d format=json -d pageSize=2 -d resultType=lite | jq -c '.resultList.result[] | keys, {journalVolume, issue, pubYear, pageInfo, firstPublicationDate, journalIssn, pubType}'
          echo "=== issues 2026 (lite 1000)"; curl -sG "$B" --data-urlencode 'query=ISSN:"0190-9622" AND PUB_YEAR:2026' -d format=json -d pageSize=1000 -d resultType=lite | jq -r '.hitCount, ([.resultList.result[] | "\(.journalVolume // "-")/\(.issue // "-")"] | group_by(.) | map("\(.[0]) \(length)") | .[])'
          echo "=== volume/issue query"; curl -sG "$B" --data-urlencode 'query=ISSN:"0190-9622" AND VOLUME:94 AND ISSUE:4' -d format=json -d pageSize=3 -d resultType=core | jq -c '.hitCount, [.resultList.result[] | {title, pageInfo, v:.journalInfo.volume, i:.journalInfo.issue, d:.journalInfo.printPublicationDate, dateOfPublication:.journalInfo.dateOfPublication}]'
          echo "=== IJDVL issues 2025"; curl -sG "$B" --data-urlencode 'query=ISSN:"0378-6323" AND PUB_YEAR:2025' -d format=json -d pageSize=1000 -d resultType=lite | jq -r '.hitCount, ([.resultList.result[] | "\(.journalVolume // "-")/\(.issue // "-")"] | group_by(.) | map("\(.[0]) \(length)") | .[])'
          echo "=== sort"; curl -sG "$B" --data-urlencode 'query=ISSN:"0190-9622" AND VOLUME:94 AND ISSUE:4' -d format=json -d pageSize=3 -d resultType=lite --data-urlencode 'sort=PAGE_INFO asc' | jq -c '.hitCount, [.resultList.result[]?.pageInfo]'
