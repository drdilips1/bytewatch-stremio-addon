name: Publish DermScholar web app

# The iPhone version (Safari → Share → Add to Home Screen): the Android app's screens plus
# research4life-android/web/web.js, published to the gh-pages branch (GitHub Pages).
on:
  push:
    paths:
      - 'research4life-android/**'
      - '!research4life-android/ios/**'
      - '!research4life-android/app/src/main/java/**'
      - '!research4life-android/app/src/main/res/**'
      - '.github/workflows/dermscholar-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dermscholar-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check web code
        working-directory: research4life-android
        run: |
          node --check web/web.js
          node --check app/src/main/assets/www/app.js
          for f in journals studio intel intel2 intel3 intel4 sync; do node --check app/src/main/assets/www/$f.js; done

      - name: Build
        run: bash research4life-android/web/build.sh "$RUNNER_TEMP/site"

      - name: Publish to gh-pages
        working-directory: ${{ runner.temp }}/site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "DermScholar web app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Published: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
