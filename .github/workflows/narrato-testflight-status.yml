name: Narrato TestFlight status

# Asks App Store Connect what happened to the uploaded iPhone builds. Runs on a push whose message has
# [testflight-status]; builds nothing.
on:
  push:
    branches: [claude/narrato-stable]
  workflow_dispatch:

jobs:
  status:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight-status]')
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - run: python .github/scripts/asc_status.py
