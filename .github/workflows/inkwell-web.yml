name: Inkwell web app

# Builds the same app for the browser (iPhone / iPad: Safari → Share → Add to
# Home Screen) and publishes it on GitHub Pages.

on:
  push:
    paths:
      - 'inkwell/**'
      - '.github/workflows/inkwell-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: inkwell-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inkwell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inkwell/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_APP_VERSION: web-${{ github.run_number }}
        run: npx vite build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: inkwell/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
