name: Inkwell web app

# Builds the same app for the browser (iPhone / iPad: Safari → Share → Add to
# Home Screen) and publishes it on GitHub Pages (the gh-pages branch, site root).
# The dermscholar/ folder of that site belongs to DermScholar (dermscholar-web.yml
# on its own branch); each workflow replaces only its own part.

on:
  push:
    paths:
      - 'inkwell/**'
      - '.github/workflows/inkwell-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inkwell-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Shared with DermScholar's web workflow: one gh-pages update at a time.
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    defaults:
      run:
        working-directory: inkwell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inkwell/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_APP_VERSION: web-${{ github.run_number }}
        run: npx vite build
      - name: Mirror the latest APK on Pages (faster downloads for in-app updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft|not) | select(.tagName|startswith("inkwell-v"))][0].tagName' || true)
          if [ -n "$tag" ]; then
            mkdir -p dist/app
            gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern '*.apk' --dir dist/app --clobber
            f=$(ls dist/app/*.apk | head -1)
            mv "$f" dist/app/Audiohub.apk
            cp dist/app/Audiohub.apk dist/app/Kathava.apk  # old link keeps working
            ver="${tag#inkwell-v}"
            gh_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$f")"
            printf '{"version":"%s","apk":"app/Audiohub.apk","github":"%s"}\n' "$ver" "$gh_url" > dist/app/latest.json
            ls -la dist/app; cat dist/app/latest.json
          fi
      - name: Publish to gh-pages (keeps DermScholar's dermscholar/ folder)
        working-directory: ${{ github.workspace }}
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -e
          git clone -q --depth 1 --branch gh-pages "$REPO_URL" "$RUNNER_TEMP/pages"
          cd "$RUNNER_TEMP/pages"
          old=$(git rev-parse HEAD)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name dermscholar -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/inkwell/dist/." .
          touch .nojekyll
          # One commit, no history: the mirrored APK would pile up.
          git checkout -q --orphan site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Audiohub web app from ${GITHUB_SHA::7} (DermScholar in dermscholar/)"
          git push -q --force-with-lease=gh-pages:$old origin site:gh-pages
