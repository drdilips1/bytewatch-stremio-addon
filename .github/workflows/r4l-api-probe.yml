name: R4L API probe
on:
  push:
    paths: ['.github/workflows/r4l-api-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Europe PMC
        run: |
          B="https://www.ebi.ac.uk/europepmc/webservices/rest/search"
          c() { printf '%s  => ' "$1"; curl -sG "$B" --data-urlencode "query=$1" -d format=json -d pageSize=3 -d resultType=lite | jq -c '[.hitCount, [.resultList.result[]?.journalTitle]]'; }
          c 'vitiligo'
          c 'vitiligo AND skin'
          c 'vitiligo AND (skin OR cutaneous)'
          c 'vitiligo AND (skin OR cutaneous OR dermatology OR dermatological OR dermatologic)'
          c '(vitiligo) AND (skin OR cutaneous OR dermatology OR dermatological OR dermatologic OR dermatitis)'
          c 'metformin AND (skin OR cutaneous OR dermatology OR dermatological OR dermatologic OR dermatitis)'
          c 'JAK inhibitors AND (skin OR cutaneous OR dermatology OR dermatological OR dermatologic OR dermatitis)'
          c 'JAK inhibitors'
          c '(JAK inhibitors) AND (TITLE_ABS:skin OR TITLE_ABS:cutaneous OR TITLE_ABS:dermatolog*)'
          c 'metformin AND MESH:"Skin Diseases"'
          c 'metformin AND MESH:"Skin"'
          echo "=== fulltextxml"; curl -s -o ft.xml -w "%{http_code} %{size_download}\n" "https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13555258/fullTextXML"; head -c 600 ft.xml; echo
          echo "=== CORS GET"; curl -s -D - -o /dev/null -H "Origin: https://appassets.androidplatform.net" "$B?query=acne&format=json&pageSize=1" | grep -i -E "access-control|^HTTP"
          echo "=== pdf render UA"; curl -s -L -o r.pdf -w "%{http_code} %{content_type} %{url_effective}\n" -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36" "https://europepmc.org/articles/PMC13555258?pdf=render"; head -c 8 r.pdf | xxd | head -1
          echo "=== pmc pdf"; curl -s -L -o p.pdf -w "%{http_code} %{content_type} %{url_effective}\n" -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36" "https://pmc.ncbi.nlm.nih.gov/articles/PMC13555258/pdf/"; head -c 8 p.pdf | xxd | head -1
          echo "=== epmc backend pdf"; curl -s -L -o b.pdf -w "%{http_code} %{content_type}\n" "https://europepmc.org/backend/ptpmcrender.fcgi?accid=PMC13555258&blobtype=pdf"; head -c 8 b.pdf | xxd | head -1
          echo "=== unpaywall"; curl -s "https://api.unpaywall.org/v2/10.3389/fimmu.2026.1915200?email=dermscholar.app@example.com" | jq -c '{is_oa, best:.best_oa_location.url_for_pdf}'
          echo "=== openalex by issn"; curl -s "https://api.openalex.org/sources/issn:0007-0963" | jq -c '{display_name,homepage_url,is_oa,summary_stats,works_count,apc_usd}'
