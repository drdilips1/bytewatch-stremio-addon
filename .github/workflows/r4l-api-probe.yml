name: R4L API probe
on:
  push:
    paths: ['.github/workflows/r4l-api-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Europe PMC
        run: |
          B="https://www.ebi.ac.uk/europepmc/webservices/rest/search"
          c() { printf '%s  => ' "$1"; curl -sG "$B" --data-urlencode "query=$1" -d format=json -d pageSize=3 -d resultType=lite | jq -c '[.hitCount, [.resultList.result[]?.journalTitle]]'; }
          c 'vitiligo'
          c 'vitiligo AND (MESH:"Skin Diseases" OR JOURNAL:dermatol*)'
          c 'vitiligo AND (MESH:"Skin Diseases" OR MESH:"Skin" OR MESH:"Dermatology" OR dermatol* OR skin OR cutaneous)'
          c 'metformin'
          c 'metformin AND (MESH:"Skin Diseases" OR MESH:"Skin" OR MESH:"Dermatology" OR dermatol* OR skin OR cutaneous)'
          c 'metformin AND (MESH:"Skin Diseases" OR MESH:"Skin" OR MESH:"Dermatology" OR JOURNAL:dermatol* OR TITLE:skin OR TITLE:cutaneous OR TITLE:dermatitis)'
          c 'metformin AND (MESH:"Skin Diseases" OR MESH:"Skin" OR JOURNAL:"J Am Acad Dermatol" OR JOURNAL:"Br J Dermatol")'
          c 'metformin AND (MESH:"Skin Diseases" OR MESH:"Skin Physiological Phenomena" OR MESH:"Dermatologic Agents" OR MESH:"Dermatology" OR MESH:"Skin")'
          c 'ISSN:"0007-0963"'
          c 'ISSN:"2784-8450"'
          c 'JOURNAL:"Dermatol Surg"'; c 'JOURNAL:"Contact Dermatitis"'; c 'JOURNAL:"Acta Derm Venereol"'; c 'JOURNAL:"J Dermatol Sci"'
          c 'JOURNAL:"Dermatol Ther"'; c 'JOURNAL:"Dermatol Clin"'; c 'JOURNAL:"JAAD Case Rep"'; c 'JOURNAL:"Skin Appendage Disord"'
          c 'JOURNAL:"J Cutan Pathol"'; c 'JOURNAL:"Am J Dermatopathol"'; c 'JOURNAL:"Photodermatol Photoimmunol Photomed"'
          c 'JOURNAL:"Lasers Surg Med"'; c 'JOURNAL:"Mycoses"'; c 'JOURNAL:"Lepr Rev"'; c 'JOURNAL:"Melanoma Res"'
          c 'JOURNAL:"Skin Res Technol"'; c 'JOURNAL:"Wound Repair Regen"'; c 'JOURNAL:"An Bras Dermatol"'; c 'JOURNAL:"Dermatitis"'
          c 'JOURNAL:"Skin Health Dis"'; c 'JOURNAL:"Actas Dermosifiliogr"'; c 'JOURNAL:"J Eur Acad Dermatol Venereol"'; c 'JOURNAL:"Indian Dermatol Online J"'
          c 'JOURNAL:"Dermatol Ther (Heidelb)"'; c 'JOURNAL:"J Invest Dermatol"'; c 'JOURNAL:"Clin Exp Dermatol"'; c 'JOURNAL:"Pediatr Dermatol"'
          echo "=== citations"; curl -s "https://www.ebi.ac.uk/europepmc/webservices/rest/MED/24523323/citations?format=json&pageSize=2" | jq -c '{hitCount, c:.citationList.citation[0]}'
          echo "=== references"; curl -s "https://www.ebi.ac.uk/europepmc/webservices/rest/MED/24523323/references?format=json&pageSize=2" | jq -c '{hitCount, r:.referenceList.reference[0]}'
          echo "=== CORS epmc"; curl -sI -H "Origin: https://appassets.androidplatform.net" "$B?query=acne&format=json&pageSize=1" | grep -i access-control
          echo "=== CORS openalex"; curl -sI -H "Origin: https://appassets.androidplatform.net" "https://api.openalex.org/sources?search=dermatology&per_page=1" | grep -i access-control
          echo "=== pdf render"; curl -sIL "https://europepmc.org/articles/PMC4086941?pdf=render" | grep -iE "^HTTP|content-type|location"
          echo "=== openalex by issn"; curl -s "https://api.openalex.org/sources/issn:0007-0963" | jq -c '{display_name,homepage_url,is_oa,summary_stats,works_count,apc_usd}'
