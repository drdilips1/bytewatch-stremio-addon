name: ss-probe
on:
  push:
    paths: [".github/workflows/ss-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W=https://audiohub.dilip-aiims.workers.dev
          t() { name=$1; shift; for o in "" "Origin: https://drdilips1.github.io"; do
            r=$(curl -sS -m 45 -o /tmp/b -D /tmp/h ${o:+-H "$o"} "$@" -w 'code=%{http_code} time=%{time_total}' 2>&1)
            echo "::notice title=$name ${o:+(web)}::$r | $(grep -i 'access-control-allow-origin' /tmp/h | tr -d '\r') | $(python3 -c "
          import json,sys
          try:
            j=json.load(open('/tmp/b')); l=j.get('results', j.get('hits', []))
            print(len(l),'results', '|', json.dumps(l[:1])[:350], '|', {k:v for k,v in j.items() if k not in ('results','hits')})
          except Exception as e: print('not json', open('/tmp/b').read()[:200])
          ")"; done; }
          t ABB -X POST -H "Content-Type: application/json" -d '{"title":"psychology of money","author":"morgan housel","limit":20}' $W/abb/api/search
          t KnabenEbooks -X POST -H "Content-Type: application/json" -d '{"query":"psychology of money","search_field":"title","size":50,"categories":[9001000,9000000,10000000]}' $W/knaben/ebooks
          t KnabenAudio -X POST -H "Content-Type: application/json" -d '{"query":"psychology of money","search_field":"title","size":50,"categories":[1003000]}' $W/knaben/audiobooks
          t Bookracy "$W/bookracy/search?q=psychology%20of%20money"
          t Preflight -X OPTIONS -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" $W/abb/api/search
