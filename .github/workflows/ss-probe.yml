name: ss-probe
on:
  push:
    paths: [".github/workflows/ss-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://drdilips1.github.io"
          for id in QL9DT RYHKB; do
            echo "=== jsonkeeper $id"
            curl -sS -m 20 -D /tmp/h -H "$O" "https://jsonkeeper.com/b/$id" -o /tmp/b; grep -i "^HTTP\|access-control" /tmp/h; head -c 700 /tmp/b; echo
          done
          echo "=== Knaben worker (GET, browser origin)"
          curl -sS -m 30 -D /tmp/h -H "$O" "https://knaben-audiobooks.drdilipgreat.workers.dev/knaben/search?q=atomic%20habits" -o /tmp/b; grep -i "^HTTP\|access-control" /tmp/h; head -c 200 /tmp/b; echo
          echo "=== ABB proxy preflight (OPTIONS)"
          curl -sS -m 30 -D - -o /dev/null -X OPTIONS -H "$O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" "https://inkshelf-debrid-proxy.tbm-a.workers.dev/abb/api/search" | grep -i "^HTTP\|access-control"
          echo "=== ABB proxy POST"
          curl -sS -m 40 -D /tmp/h -H "$O" -H "Content-Type: application/json" -d '{"query":"atomic habits"}' "https://inkshelf-debrid-proxy.tbm-a.workers.dev/abb/api/search" -o /tmp/b; grep -i "^HTTP\|access-control" /tmp/h; head -c 200 /tmp/b; echo
          echo "=== raw.githubusercontent CORS"
          curl -sS -m 20 -D - -o /dev/null -H "$O" "https://raw.githubusercontent.com/drdilips1/audiohub/main/README.md" | grep -i "^HTTP\|access-control"
