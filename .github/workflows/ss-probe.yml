name: ss-probe
on:
  push:
    paths: [".github/workflows/ss-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          O="Origin: https://drdilips1.github.io"
          note() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | cut -c1-900)"; }
          for u in https://jsonkeeper.com/b/QL9DT https://jsonkeeper.com/b/RYHKB "https://knaben-audiobooks.drdilipgreat.workers.dev/knaben/search?q=atomic%20habits" https://knaben-audiobooks.drdilipgreat.workers.dev/manifest.json; do
            r=$(curl -sS -m 25 -D /tmp/h -H "$O" "$u" -o /tmp/b -w 'code=%{http_code} time=%{time_total}' 2>&1)
            note "$u" "$r | $(grep -i 'access-control-allow-origin\|^server\|cf-mitigated' /tmp/h | tr -d '\r' | tr '\n' ' ') | $(head -c 500 /tmp/b)"
          done
          r=$(curl -sS -m 40 -D /tmp/h -H "$O" -H "Content-Type: application/json" -d '{"query":"atomic habits"}' "https://inkshelf-debrid-proxy.tbm-a.workers.dev/abb/api/search" -o /tmp/b -w 'code=%{http_code}' 2>&1)
          note "ABB POST" "$r | $(grep -i 'access-control-allow-origin' /tmp/h | tr -d '\r') | $(head -c 300 /tmp/b)"
