name: ss-probe
on:
  push:
    paths: [".github/workflows/ss-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          for q in "project+hail+mary" "project%20hail%20mary" "hail+mary" "atomic+habits"; do
            for u in "https://audiobookbay.lu/?s=$q&cat=undefined%2Cundefined" "https://audiobookbay.lu/?s=$q" "https://audiobookbay.lu/?s=$q&tt=1"; do
              curl -sS -m 25 -A "$UA" -L "$u" -o /tmp/b -w '%{http_code} %{url_effective}' > /tmp/c 2>&1
              t=$(python3 -c "
          import re
          h=open('/tmp/b',encoding='utf-8',errors='ignore').read()
          ts=re.findall(r'class=\"postTitle\"[\s\S]*?<a[^>]+>([\s\S]*?)</a>',h)
          print(len(ts), '|', ' ;; '.join(re.sub('<[^>]+>','',x)[:50] for x in ts[:4]), '|', (re.search(r'<title>([^<]*)',h) or [0,''])[1][:60])
          ")
              echo "::notice title=$q::$(cat /tmp/c) => $t"
            done
          done
