name: ss-probe
on:
  push:
    paths: [".github/workflows/ss-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cp inkwell/workers/audiobookbay.js /tmp/w.mjs
          cat > /tmp/t.mjs <<'JS'
          globalThis.caches = { default: { match: async () => null, put: async () => {} } };
          const w = (await import('/tmp/w.mjs')).default;
          const ctx = { waitUntil() {} };
          const note = (t, m) => console.log(`::notice title=${t}::${String(m).replace(/\n/g, ' ').slice(0, 1500)}`);
          for (const h of ['audiobookbay.lu','audiobookbay.is','theaudiobookbay.se','audiobookbay.fi']) {
            try { const r = await fetch(`https://${h}/?s=atomic+habits&cat=undefined%2Cundefined`, { headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' } });
              const t = await r.text(); note('mirror ' + h, `HTTP ${r.status} url=${r.url} len=${t.length} posts=${(t.match(/class="post"/g)||[]).length} title=${(/<title>([^<]*)/.exec(t)||[])[1]}`); } catch (e) { note('mirror ' + h, e.message); }
          }
          const m = await (await w.fetch(new Request('https://x.workers.dev/manifest.json'), {}, ctx)).json();
          note('manifest', m.adapters.source.request.url);
          for (const q of ['atomic habits', 'deep medicine topol']) {
            const t0 = Date.now();
            const r = await w.fetch(new Request('https://x.workers.dev/search?q=' + encodeURIComponent(q)), {}, ctx);
            const j = await r.json();
            note(`search "${q}" HTTP ${r.status} in ${Date.now()-t0}ms`, `${j.error || ''} n=${j.results.length} ` + JSON.stringify(j.results.slice(0, 2).map(x => ({ ...x, magnetUrl: x.magnetUrl?.slice(0, 70) }))));
          }
          JS
          node /tmp/t.mjs
