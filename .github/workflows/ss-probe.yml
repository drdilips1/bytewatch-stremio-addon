name: ss-probe
on:
  push:
    paths: [".github/workflows/ss-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          curl -sSL -m 30 -A "$UA" "https://play.google.com/store/search?q=storyshots&c=apps&hl=en" | grep -o 'details?id=[A-Za-z0-9._]*' | sort -u | head -10
          echo "=== site links to the app"
          curl -sSL -m 30 -A "$UA" "https://www.getstoryshots.com/" | grep -o -E 'play.google.com/store/apps/details\?id=[A-Za-z0-9._]+|apps.apple.com/[^"]+' | sort -u | head
# lookup
