name: ss-probe
on:
  push:
    paths: [".github/workflows/ss-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          for u in "https://apibay.org/q.php?q=project%20hail%20mary&cat=102" "https://apibay.org/q.php?q=project%20hail%20mary" "https://apibay.org/q.php?q=sapiens&cat=601" "https://torrents-csv.com/service/search?q=project%20hail%20mary&size=100"; do
            r=$(curl -sS -m 30 -A "$UA" -o /tmp/b -w 'code=%{http_code} time=%{time_total}' "$u" 2>&1)
            echo "::notice title=$u::$r | $(python3 -c "
          import json
          try:
            j=json.load(open('/tmp/b')); l=j if isinstance(j,list) else j.get('torrents',[])
            print(len(l), [ (x.get('name'), x.get('category'), x.get('seeders')) for x in l[:8]])
          except Exception as e: print('not json', open('/tmp/b').read()[:300])
          ")"
          done
