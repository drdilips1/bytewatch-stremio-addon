name: PDF Editor APK

on:
  push:
    paths:
      - 'pdf-editor-android/**'
      - '.github/workflows/pdf-editor-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-editor-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PdfEditor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PdfEditor-apk
          path: pdf-editor-android/PdfEditor.apk

      - name: Publish to "pdf-editor-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-editor-latest
          name: PDF Editor (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: Offline PDF editor APK built from `${{ github.sha }}` on `${{ github.ref_name }}`.
          files: pdf-editor-android/PdfEditor.apk
