name: Groq probe
on:
  push:
    paths: ['.github/workflows/groq-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          get() { echo "=================== $1"; curl -sL -m 30 "$1" | python3 -c "
          import sys,re,html
          t=sys.stdin.read()
          if '<html' in t[:2000].lower():
              t=re.sub(r'(?s)<script.*?</script>|<style.*?</style>','',t); t=re.sub(r'<[^>]+>',' ',t); t=html.unescape(t)
          t=re.sub(r'[ \t]+',' ',t); t=re.sub(r'\n\s*\n+','\n',t)
          print(t[:${2:-6000}])"; }
          get https://console.groq.com/llms.txt 5000
          get https://console.groq.com/docs/models.md 9000
          get https://console.groq.com/docs/structured-outputs.md 7000
          get https://console.groq.com/docs/rate-limits.md 7000
          get https://console.groq.com/docs/prompt-caching.md 3000
          echo "== api no key"; curl -s -m 20 https://api.groq.com/openai/v1/models | head -c 300
