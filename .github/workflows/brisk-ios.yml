name: Audibrisk iPhone app

# Audibrisk for iPhone. Mac runners cost minutes on this private repository (the first build
# waited and was cancelled), so the iPhone app is built in the PUBLIC repository
# drdilips1/audibrisk, where Mac runners are free. This job (Linux, cheap) builds Audibrisk's
# screens — with the public-only check — packs the iPhone kit (brisk/ios-kit/make-kit.mjs: screens,
# Capacitor settings, player + Files plugins, icon, the build recipe ios.yml) and pushes it to that
# repository's branch ios-kit; its own workflow then makes Audibrisk.ipa and the AltStore source.
# Needs the AUDIBRISK_PUBLIC_TOKEN secret with Contents AND Workflows: read and write.
# Built only when asked: Run workflow, or a commit with [build brisk ios] in its message.
on:
  workflow_dispatch:
  push:
    paths:
      - 'inkwell/brisk/**'
      - '.github/workflows/brisk-ios.yml'

permissions:
  contents: read

concurrency:
  group: brisk-ios
  cancel-in-progress: true

jobs:
  kit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build brisk ios]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inkwell
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inkwell/package-lock.json

      - name: Build Audibrisk's screens
        env:
          VITE_APP_VERSION: ios-${{ github.run_number }}
        run: |
          npm ci
          npx vite build --config vite.brisk.config.js

      - name: Pack the iPhone kit
        run: node brisk/ios-kit/make-kit.mjs "$RUNNER_TEMP/kit" "$VERSION_NAME"

      - name: Push it to the public repository (its Mac build starts by itself)
        env:
          TOKEN: ${{ secrets.AUDIBRISK_PUBLIC_TOKEN }}
        working-directory: ${{ runner.temp }}/kit
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::The AUDIBRISK_PUBLIC_TOKEN secret isn't set"; exit 1; fi
          git init -q -b ios-kit
          git config user.name "Audibrisk build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Audibrisk for iPhone $VERSION_NAME"
          git push -f "https://x-access-token:${TOKEN}@github.com/drdilips1/audibrisk.git" ios-kit 2>&1 | sed "s/${TOKEN}/***/g"
          echo "Pushed. The iPhone build runs at https://github.com/drdilips1/audibrisk/actions"
