name: Paper2Audio Android APK

on:
  push:
    paths:
      - "paper2audio/android/**"
      - ".github/workflows/paper2audio-android.yml"
  workflow_dispatch:

permissions:
  contents: write # publish the APK to the paper2audio-apk release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper2audio/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch Kokoro engine (sherpa-onnx native library)
        env:
          SHERPA_ONNX_VERSION: v1.13.8 # must match app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt
        run: |
          curl -fsSL -o sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION}-android.tar.bz2"
          mkdir -p sherpa app/src/main/jniLibs/arm64-v8a
          tar xjf sherpa.tar.bz2 -C sherpa
          cp -v $(find sherpa -path '*arm64-v8a/*.so') app/src/main/jniLibs/arm64-v8a/
          test -f app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so
          rm -rf sherpa sherpa.tar.bz2

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.P2A_KEYSTORE_B64 || secrets.SIGNING_KEY }}
          P2A_KEYSTORE_PASSWORD: ${{ secrets.P2A_KEYSTORE_PASSWORD || secrets.SIGNING_PASSWORD }}
          P2A_KEY_ALIAS: ${{ secrets.P2A_KEY_ALIAS || secrets.SIGNING_ALIAS || 'p2a' }}
          # Play Store edition ads (Google's test ads until these secrets are set).
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/p2a.keystore"
            export P2A_KEYSTORE="$RUNNER_TEMP/p2a.keystore"
          fi
          chmod +x gradlew
          ./gradlew assembleFullRelease assembleLiteRelease bundleLiteRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/full/release/app-full-release.apk Paper2Audio.apk
          # Play Store edition: the bundle to upload, and an APK to try it on a phone.
          cp app/build/outputs/apk/lite/release/app-lite-release.apk Narrato.apk
          cp app/build/outputs/bundle/liteRelease/app-lite-release.aab Narrato.aab
          ls -la Paper2Audio.apk Narrato.apk Narrato.aab
          # For the in-app "Update available" check.
          CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          NAME=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          printf '{"versionCode": %s, "versionName": "%s"}\n' "$CODE" "$NAME" > version.json
          cat version.json

      - name: Show signing certificate (SHA-1 must match the Google Cloud OAuth client)
        env:
          HAS_KEY: ${{ (secrets.P2A_KEYSTORE_B64 || secrets.SIGNING_KEY) != '' }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs Paper2Audio.apk | grep -i "SHA-1" || true
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::No P2A_KEYSTORE_B64 secret: signed with a temporary debug key (Google sign-in won't work, and updates need an uninstall)."
          fi

      - name: Check native libraries for 16 KB pages (required by Google Play)
        run: |
          python3 - <<'PY'
          import struct, zipfile
          z = zipfile.ZipFile("Narrato.apk")
          bad = []
          for n in z.namelist():
              if not n.endswith(".so"): continue
              d = z.read(n)
              phoff = struct.unpack_from("<Q", d, 0x20)[0]; phentsize, phnum = struct.unpack_from("<HH", d, 0x36)
              aligns = [struct.unpack_from("<Q", d, phoff + i * phentsize + 0x30)[0]
                        for i in range(phnum) if struct.unpack_from("<I", d, phoff + i * phentsize)[0] == 1]
              ok = min(aligns) >= 16384
              print(("OK  " if ok else "BAD ") + n, [hex(a) for a in aligns])
              if not ok: bad.append(n)
          if bad: print("::warning::Not 16 KB aligned: " + ", ".join(bad))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Paper2Audio-apk
          path: |
            paper2audio/android/Paper2Audio.apk
            paper2audio/android/Narrato.apk
            paper2audio/android/Narrato.aab

      - name: Publish the Play Store edition (bundle to upload, APK to try)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: narrato-lite
          name: Narrato (Play Store edition) – latest build
          prerelease: true
          overwrite_files: true
          files: |
            paper2audio/android/Narrato.apk
            paper2audio/android/Narrato.aab
          body: |
            Play Store edition. Upload **Narrato.aab** to Google Play Console.
            **Narrato.apk** installs on a phone for testing (separate from Paper to Audio).

      - name: Publish to the permanent download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paper2audio-apk
          name: Paper to Audio – Android app (latest build)
          prerelease: true
          overwrite_files: true
          files: |
            paper2audio/android/Paper2Audio.apk
            paper2audio/android/version.json
          body: |
            Latest build of the Paper to Audio Android app. Open this page on your phone and
            tap **Paper2Audio.apk** to install or update (updates install over the old app).

            Direct link: https://github.com/${{ github.repository }}/releases/download/paper2audio-apk/Paper2Audio.apk
