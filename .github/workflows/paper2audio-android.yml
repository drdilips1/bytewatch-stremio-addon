name: Paper2Audio Android APK

on:
  push:
    paths:
      - "paper2audio/android/**"
      - ".github/workflows/paper2audio-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper2audio/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.P2A_KEYSTORE_B64 }}
          P2A_KEYSTORE_PASSWORD: ${{ secrets.P2A_KEYSTORE_PASSWORD }}
          P2A_KEY_ALIAS: ${{ secrets.P2A_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/p2a.keystore"
            export P2A_KEYSTORE="$RUNNER_TEMP/p2a.keystore"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Paper2Audio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Paper2Audio-apk
          path: paper2audio/android/Paper2Audio.apk
