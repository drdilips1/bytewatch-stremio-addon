name: Inkwell Android APK

on:
  push:
    paths:
      - 'inkwell/**'
      - '.github/workflows/inkwell-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inkwell-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inkwell
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inkwell/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Install & build web app
        env:
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
          # The sync server comes from inkwell/.env.production.
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.INKWELL_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.INKWELL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INKWELL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.INKWELL_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/inkwell.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            # One secret is enough: password/alias default to the values the
            # keystore was generated with; override with the other secrets if needed.
            echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$KS"
            KS_PASS="${KS_PASS:-inkwell-ci}"
            KEY_ALIAS="${KEY_ALIAS:-inkwell}"
            KEY_PASS="${KEY_PASS:-$KS_PASS}"
            echo "Signing with the permanent release key (updates install over each other)."
          else
            echo "::warning::No INKWELL_KEYSTORE_BASE64 secret - signing with a throwaway key; each build needs an uninstall first."
            # No release key configured: generate a throwaway key so the APK still installs.
            KS_PASS=inkwell-ci KEY_PASS=inkwell-ci KEY_ALIAS=inkwell
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Inkwell,O=Inkwell,C=US"
          fi
          {
            echo "INKWELL_KEYSTORE=$KS"
            echo "INKWELL_KEYSTORE_PASSWORD=$KS_PASS"
            echo "INKWELL_KEY_ALIAS=$KEY_ALIAS"
            echo "INKWELL_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: inkwell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/Inkwell-v${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Inkwell-v${{ env.VERSION_NAME }}
          path: inkwell/out/*.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: inkwell-v${{ env.VERSION_NAME }}
          name: Inkwell v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: inkwell/out/*.apk
          body: |
            Inkwell for Android — download the APK below and open it on your phone
            (allow "Install unknown apps" for your browser or file manager when asked).

            Built from ${{ github.sha }} on `${{ github.ref_name }}`.
