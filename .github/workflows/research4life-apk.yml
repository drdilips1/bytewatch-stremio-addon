name: Build Research4Life APK

on:
  push:
    paths:
      - 'research4life-android/**'
      - '.github/workflows/research4life-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research4life-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Research4Life.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Research4Life-apk
          path: research4life-android/Research4Life.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="research4life-apk-${{ github.run_number }}"
          gh release create "$TAG" Research4Life.apk \
            --target "${{ github.sha }}" \
            --title "Research4Life APK (build ${{ github.run_number }})" \
            --notes "Android app for https://portal.research4life.org/signin. Download Research4Life.apk below and open it on your phone (allow installing from unknown sources)." \
            --prerelease
