name: Build DermScholar APK

on:
  push:
    paths:
      - 'research4life-android/**'
      - '!research4life-android/web/**'
      - '!research4life-android/ios/**'
      - '.github/workflows/research4life-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research4life-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check web app syntax
        run: |
          node --check app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/journals.js
          for f in studio intel intel2 intel3 intel4 intel5 sync; do node --check app/src/main/assets/www/$f.js; done
          for f in app/src/main/assets/www/lx/*.js; do node --check "$f"; done

      - name: Check journal queries against Europe PMC
        continue-on-error: true
        run: node tools/check-journals.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash tools/fetch-sherpa.sh
          gradle assembleDermscholarRelease assembleLesionautRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/dermscholar/release/app-dermscholar-release.apk DermScholar.apk
          cp app/build/outputs/apk/lesionaut/release/app-lesionaut-release.apk Lesionaut.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DermScholar-apk
          path: research4life-android/DermScholar.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dermscholar-${{ github.run_number }}"
          gh release create "$TAG" DermScholar.apk \
            --target "${{ github.sha }}" \
            --title "DermScholar APK (build ${{ github.run_number }})" \
            --notes "Dermatology research app with Research4Life access. Download DermScholar.apk below and open it on your Android phone (allow installing from unknown sources). Updates install over the previous version and keep your library." \
            --prerelease

      - name: Publish to the in-app update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app checks dermscholar-latest/version.json and installs DermScholar.apk from there.
          CODE=$(grep -oE 'versionCode [0-9]+' app/build.gradle | head -1 | grep -oE '[0-9]+')
          NAME=$(grep -oE "versionName '[^']+'" app/build.gradle | head -1 | cut -d"'" -f2)
          printf '{"versionCode": %s, "versionName": "%s"}\n' "$CODE" "$NAME" > version.json
          cat version.json
          gh release view dermscholar-latest >/dev/null 2>&1 || gh release create dermscholar-latest \
            --title "DermScholar (latest build)" --prerelease \
            --notes "Always the newest DermScholar. The app updates itself from here (Settings → App updates). Direct download: https://github.com/${{ github.repository }}/releases/download/dermscholar-latest/DermScholar.apk"
          gh release upload dermscholar-latest DermScholar.apk version.json --clobber

      - name: Publish Lesionaut (its own update channel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lesionaut (the diagnosis app) checks lesionaut-latest/version.json and installs Lesionaut.apk.
          CODE=$(sed -n '/lesionaut {/,/}/p' app/build.gradle | grep -oE 'versionCode [0-9]+' | grep -oE '[0-9]+')
          NAME=$(sed -n '/lesionaut {/,/}/p' app/build.gradle | grep -oE "versionName '[^']+'" | cut -d"'" -f2)
          mkdir -p lx && printf '{"versionCode": %s, "versionName": "%s"}\n' "$CODE" "$NAME" > lx/version.json
          cat lx/version.json
          gh release view lesionaut-latest >/dev/null 2>&1 || gh release create lesionaut-latest \
            --title "Lesionaut (latest build)" --prerelease \
            --notes "Lesionaut, the dermatology diagnostic copilot. Download Lesionaut.apk below and open it on your Android phone (allow installing from unknown sources). It installs alongside DermScholar and updates itself from here. Direct download: https://github.com/${{ github.repository }}/releases/download/lesionaut-latest/Lesionaut.apk"
          gh release upload lesionaut-latest Lesionaut.apk lx/version.json --clobber
