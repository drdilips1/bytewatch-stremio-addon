name: R4L probe
on:
  push:
    paths: ['.github/workflows/r4l-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36"
          U="https://login.research4life.org/tacgw/init.cshtml?cs=0&origUrl=%2ftacsgr1doi_org%2f10.1016%2fj.jaad.2026.06.106"
          curl -s -A "$UA" -c jar -b jar -L -D h.txt -o g.html "$U"; grep -iE "^HTTP|location|set-cookie" h.txt | cut -c1-200
          echo "=== size"; wc -c g.html; grep -oiE '<title>[^<]*' g.html
          echo "=== forms"; grep -oiE '<(form|input|button|select|a )[^>]*>' g.html | cut -c1-250 | head -60
          echo "=== scripts"; grep -oiE '<script[^>]*>' g.html | head; grep -oiE 'window\.location[^;]{0,200}' g.html | head
          echo "=== text"; sed -e 's/<[^>]*>/ /g' g.html | tr -s ' \n' | head -c 2500
